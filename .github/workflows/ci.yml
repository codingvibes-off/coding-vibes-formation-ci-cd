name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Tests d'intégration : type identifié comme manquant par tests-strategy
      # (voir tests-strategy-report.json). Aucun fichier *.integration.spec.ts
      # n'existe encore dans src/app/services : étape volontairement omise
      # tant qu'aucun test correspondant n'a été écrit, pour ne pas casser le pipeline.

      - name: Build production
        run: npm run build -- --configuration production

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E tests (Playwright)
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.build-and-test.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Ce job se déclenche automatiquement sur GitHub (push sur main, build-and-test réussi).
    # Il ne doit JAMAIS être exécuté localement par la skill execution-ci-cd sans confirmation explicite.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build -- --configuration production --base-href /coding-vibes-formation-ci-cd/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/coding-vibes-formation/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
